name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs (CodeGuard CG-16).
permissions: {}

jobs:
  # Everything that runs project code or installs dependencies happens here,
  # with a read-only token that is not persisted into the checkout.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      # A tag that disagrees with the package version would publish a wheel
      # whose filename contradicts its release page.
      - name: Tag matches package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          }

      - name: Install
        run: uv sync --all-extras --locked

      - name: make check
        run: make check

      # Wheel, sdist, provenance manifest, and the hash-locked appliance
      # wheelhouse (scripts/build_wheelhouse.py).
      - name: make build
        run: make build

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on                    { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md || { echo "no CHANGELOG.md entry for $version"; exit 1; }

      - name: Assemble release assets
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir release
          cp dist/*.whl dist/*.tar.gz dist/*.build.json dist/release-notes.md release/
          tar -C dist -czf "release/tensorstead-${version}-wheelhouse.tar.gz" \
            "tensorstead-${version}-wheelhouse"
          (cd release && sha256sum -- *.whl *.tar.gz *.build.json > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The only job with write authority. It installs, tests and builds nothing:
  # it attests the build job's artifacts and publishes them.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to
    # put a human approval in front of every release.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Signed build provenance (Sigstore) binding every asset to this
      # repository, this workflow and this commit. `make deploy-release`
      # verifies it before anything is installed (CodeGuard CG-17).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.build.json
            release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tensorstead ${GITHUB_REF_NAME}" \
            --notes-file release/release-notes.md \
            release/*.whl release/*.tar.gz release/*.build.json release/SHA256SUMS
