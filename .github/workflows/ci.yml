name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest available.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --locked

      # Lint, typecheck, every non-hardware test, and the coverage floor. The
      # runner has a Docker daemon, so the Docker integration tests run here
      # rather than skipping as they do on a laptop without one.
      - name: make check
        run: make check

      # Syntax and lint only; contacts no host.
      - name: make ansible-check
        run: make ansible-check

  extras:
    # Every other job installs all extras at once, which hides an extra that
    # forgot a dependency. Install the built wheel one extra at a time.
    name: each extra installs alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Each extra in isolation
        run: |
          wheel="$PWD/$(ls dist/*.whl)"
          alone() { uv run --no-project --isolated --with "tensorstead[$1] @ file://$wheel" "${@:2}"; }
          alone cli stead --version
          alone cli stead --help > /dev/null
          alone mcp python -c "import tensorstead.mcp.server"
          alone coordinator python -c "import tensorstead.coordinator.app"
          alone agent python -c "import tensorstead.agent.app"
