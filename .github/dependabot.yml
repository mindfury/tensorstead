# Version updates. Security updates are configured in the repository settings
# (Dependabot security updates, grouped) and need nothing here.
#
# Weekly and grouped, so a single-maintainer repository gets at most one PR per
# ecosystem per week. Every PR runs `make check` in CI like any other.
version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot keeps the pins and
  # their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv.lock / pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
